<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Centro de Operaciones · Dugomotos v2</title>

<!-- Base -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">

<!-- Modules -->
<link rel="stylesheet" href="css/modules/negocios.css">
<link rel="stylesheet" href="css/modules/procedimiento.css">
<link rel="stylesheet" href="css/modules/alistamiento.css">
<link rel="stylesheet" href="css/modules/plan.css">
<link rel="stylesheet" href="css/modules/home.css">
<link rel="stylesheet" href="css/modules/planilla.css">
</head>
<body>

<div class="app">

  <!-- ============================================================
       SIDEBAR
       ============================================================ -->
  <aside class="side">
    <div class="side-brand">
      <div class="side-logo">DM</div>
      <div>
        <div class="side-name">Dugomotos</div>
        <div class="side-sub">v2</div>
      </div>
    </div>

    <div class="side-group">
      <div class="side-group-title">Principal</div>

      <!-- Inicio -->
      <div class="side-link on" data-sec="home" onclick="setMain('home')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9.5L12 3l9 6.5V21a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V9.5z"/>
        </svg>
        Inicio
      </div>

      <!-- Negocios -->
      <div class="side-link" data-sec="negocios" onclick="setMain('negocios')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M3 3v18h18"/>
          <path d="M7 14l4-4 4 4 5-5"/>
        </svg>
        Negocios activos
      </div>
    </div>

    <div class="side-group">
      <div class="side-group-title">Procedimiento</div>

      <!-- Trámites (parent) -->
      <div class="side-link parent" id="parentProc" onclick="toggleProcParent()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        Trámites
        <span class="side-chevron">▶</span>
      </div>

      <div class="side-sub" id="procSubs">
        <div class="sublink" data-sec="proc" onclick="event.stopPropagation();setMain('proc')">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Procedimiento
        </div>
        <div class="sublink" data-sec="config" onclick="event.stopPropagation();setMain('config')">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
          Configuración
        </div>
      </div>
    </div>

    <div class="side-group">
      <div class="side-group-title">Servicio Técnico</div>

      <!-- Alistamiento -->
      <div class="side-link" data-sec="alist" onclick="setMain('alist')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M20 7L9 18l-5-5"/>
        </svg>
        Alistamiento
      </div>

      <!-- Plan de alistamientos -->
      <div class="side-link" data-sec="plan" onclick="setMain('plan')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M8 2v4M16 2v4M3 10h18"/>
        </svg>
        Plan de alistamientos
      </div>

      <!-- Planilla diaria -->
      <div class="side-link" data-sec="planilla" onclick="setMain('planilla')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M9 2h6a2 2 0 012 2v2h2a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h2V4a2 2 0 012-2z"/>
          <path d="M8 12h8M8 16h5"/>
        </svg>
        Planilla diaria
      </div>
    </div>

  </aside>

  <!-- ============================================================
       MAIN CONTENT
       ============================================================ -->
  <main class="main" id="c"></main>

</div>

<!-- Mobile bar -->
<div class="mobile-bar">
  <div class="mobile-burger" onclick="toggleSideMobile()">
    <span></span><span></span><span></span>
  </div>
  <div class="mobile-title">
    <div class="mobile-title-logo">DM</div>
    <div class="mobile-title-name">Dugomotos v2</div>
  </div>
</div>

<div class="side-overlay" id="sideOverlay" onclick="toggleSideMobile()"></div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- ============================================================
     SCRIPTS
     ============================================================ -->
<script src="js/data.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>

<script src="js/modules/negocios.js"></script>
<script src="js/modules/procedimiento.js"></script>
<script src="js/modules/alistamiento.js"></script>
<script src="js/modules/plan.js"></script>
<script src="js/modules/config.js"></script>
<script src="js/modules/home.js"></script>
<script src="js/modules/planilla.js"></script>

<script src="js/app.js"></script>

</body>
</html>
