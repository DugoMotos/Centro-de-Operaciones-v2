<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dugomotos — Operaciones</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ============================================================
     CSS — Orden importa: base → layout → components → modules
     ============================================================
     CACHE-BUSTING: el ?v= al final de cada archivo obliga al
     navegador a bajar la versión nueva después de un deploy.
     Sin esto, el equipo puede quedar con CSS/JS viejo cacheado.

     >>> SUBIR EL NÚMERO EN CADA DEPLOY (acá y en los <script>) <<<
     ============================================================ -->
<link rel="stylesheet" href="css/base.css?v=2.1.0">
<link rel="stylesheet" href="css/layout.css?v=2.1.0">
<link rel="stylesheet" href="css/components.css?v=2.1.0">
<link rel="stylesheet" href="css/modules/negocios.css?v=2.1.0">
<link rel="stylesheet" href="css/modules/procedimiento.css?v=2.1.0">
<link rel="stylesheet" href="css/modules/alistamiento.css?v=2.1.0">
<link rel="stylesheet" href="css/modules/plan.css?v=2.1.0">
<link rel="stylesheet" href="css/modules/home.css?v=2.1.0">
<link rel="stylesheet" href="css/modules/planilla.css?v=2.1.0">
</head>
<body>

<!-- Overlay para cerrar el menú móvil al tocar fuera -->
<div class="side-overlay" id="sideOverlay" onclick="toggleSide()"></div>

<div class="app">

  <!-- Mobile bar (visible solo en móvil) -->
  <div class="mobile-bar">
    <button class="mobile-burger" onclick="toggleSide()" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
    <div class="mobile-title">
      <div class="mobile-title-logo">DM</div>
      <div class="mobile-title-name">DUGOMOTOS</div>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="side" id="sideMenu">
    <div class="side-brand">
      <div class="side-logo">DM</div>
      <div class="side-name">DUGOMOTOS</div>
      <div class="side-sub">Intranet</div>
    </div>

    <div class="side-group">
      <div class="side-group-title">Principal</div>

      <!-- Inicio -->
      <div class="side-link on" data-sec="home" onclick="setMain('home')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9.5L12 3l9 6.5V21a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V9.5z"/>
        </svg>
        Inicio
      </div>

      <!-- Negocios -->
      <div class="side-link" data-sec="negocios" onclick="setMain('negocios')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
        </svg>
        Negocios
      </div>

      <!-- Procedimiento (expandible) -->
      <div class="side-link parent expanded" id="parentProc" onclick="toggleProcParent()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="9" y1="13" x2="15" y2="13"/>
          <line x1="9" y1="17" x2="15" y2="17"/>
        </svg>
        Procedimiento
        <span class="side-chevron">▸</span>
      </div>
      <div class="side-sub open" id="subProc">
        <div class="sublink" data-sec="proc" onclick="event.stopPropagation();setMain('proc')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Trámites
        </div>
        <div class="sublink" data-sec="alist" onclick="event.stopPropagation();setMain('alist')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Servicio Técnico
        </div>
        <div class="sublink" data-sec="plan" onclick="event.stopPropagation();setMain('plan')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Plan
        </div>
        <div class="sublink" data-sec="planilla" onclick="event.stopPropagation();setMain('planilla')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Planilla diaria
        </div>
      </div>
    </div>

    <div class="side-group">
      <div class="side-group-title">Sistema</div>
      <div class="side-link" data-sec="config" onclick="setMain('config')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.6h.09A1.65 1.65 0 0010 3.09V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        Configuración
      </div>
    </div>
  </aside>

  <!-- Main content area -->
  <main class="main" id="c"></main>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<!-- ============================================================
     JAVASCRIPT — Orden CRÍTICO: dependencias antes de uso
     ============================================================ -->
<script src="js/config.js?v=2.1.0"></script>
<script src="js/data.js?v=2.1.0"></script>
<script src="js/utils.js?v=2.1.0"></script>
<script src="js/state.js?v=2.1.0"></script>
<script src="js/api.js?v=2.1.0"></script>
<script src="js/modules/negocios.js?v=2.1.0"></script>
<script src="js/modules/procedimiento.js?v=2.1.0"></script>
<script src="js/modules/alistamiento.js?v=2.1.0"></script>
<script src="js/modules/plan.js?v=2.1.0"></script>
<script src="js/modules/home.js?v=2.1.0"></script>
<script src="js/modules/planilla.js?v=2.1.0"></script>
<script src="js/modules/config.js?v=2.1.0"></script>
<script src="js/app.js?v=2.1.0"></script>

</body>
</html>
